[package]
name = "xinput9_1_0"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]
name = "xinput9_1_0"

[dependencies]
retour = "0.3"
serde_json = "1"
nozavolochen-strings = { version = "0.0.0", path = "crates/strings" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
members = [".", "crates/strings"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
